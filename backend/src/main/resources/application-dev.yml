# 本地内存库。密钥是公开的开发占位值，不能用于生产。
spring:
  datasource:
    url: jdbc:h2:mem:ftcrm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

ftcrm:
  openapi-public: true
  vault:
    key: ${CONTACT_VAULT_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    hash-key: ${CONTACT_VAULT_HASH_KEY:ZGV2LWhhc2gta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiE=}
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-32b}
    ttl-hours: 12

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
